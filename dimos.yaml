# dim-app is a library (vendored into apps as dim-app/), not an app: this lists what its helpers call, so an app
# using a helper knows what to put in its own `uses:`. tests/dimos_yaml_test.js keeps it in sync with source/.
# spec v1.4: "@desktop-gateway" paths are relative to /gateways/desktop/, "@dimos-gateway" ones to /gateways/dimos/.
# Not listed (Desktop's top level, not a gateway's): desktop.js's GET /apps (the installed apps) and openApp's /?app=<id>
# link, theme.js's /theme.css (pages link it undeclared), desktop_events.js's deprecated, internal GET /api/events.
spec-version: v1.4
uses:
    "@dimos-gateway":
        # dim_app.js: DimApp's message codec (msgDecodeEndpoint, e.g. ../../gateways/dimos/msgs.js)
        - GET /msgs.js
    "@desktop-gateway":
        # notify.js: notifications, with the app's icon as the default
        - POST /ui/notifications
        - GET /info/apps/{pkg}/icon
        # errors.js: the error feed
        - POST /ui/errors
        # shell.js: runShell (start, long-poll, cancel)
        - POST /ui/shell
        - GET /ui/shell/{id}
        - POST /ui/shell/{id}/cancel
        # zenoh.js: where the zenoh-gateway and this app's namespace are
        - GET /management/gateways/zenoh
        # frontend_publish.js (backend): publish on <ns>/apps/<app>/frontend/<topic>
        - POST /ui/apps/{pkg}/frontend/{topic}
    # zenoh.js (getZenoh, DimApp, desktop_events.js): Subscription.update needs >=0.5.1
    "@zenoh-gateway": ">=0.5.1"
