# dim-app is a library (vendored into apps as dim-app/), not an app: this lists what its helpers call, so an app
# using a helper knows what to put in its own `uses:`. tests/dimos_yaml_test.js keeps it in sync with source/.
# spec v1.4: "@desktop-gateway" paths are relative to /gateways/desktop/, "@dimos-gateway" ones to /gateways/dimos/.
# Not listed (Desktop's top level, not a gateway's): openApp's /?app=<id> link and theme.js's /theme.css (pages link it
# undeclared).
spec-version: v1.4
uses:
    "@dimos-gateway":
        # dim_app.js: DimApp's message codec (msgDecodeEndpoint, e.g. ../../gateways/dimos/msgs.js)
        - GET /msgs.js
        # recordings.js: recordingsDir(), the folder recordings are kept in (the only thing that knows);
        # watchRecordingsDir() re-asks it on that setting's config event
        - GET /history/recordings
        # config.js: sharedConfig(), the shared config.yaml's settings as the gateway resolves them; its `config`
        # event (<ns>/dimos/events/config/<setting>, one topic per setting; watchSharedConfig) says to read it again
        - GET /config
    "@desktop-gateway":
        # notify.js: notifications, with the app's icon as the default
        - POST /ui/notifications
        - GET /info/apps/{pkg}/icon
        # errors.js: the error feed
        - POST /ui/errors
        # shell.js: runShell (start, long-poll, cancel)
        - POST /ui/shell
        - GET /ui/shell/{id}
        - POST /ui/shell/{id}/cancel
        # zenoh.js: where the zenoh-gateway and this app's namespace are
        - GET /management/gateways/zenoh
        # frontend_publish.js (backend): publish on <ns>/apps/<app>/frontend/<topic>
        - POST /ui/apps/{pkg}/frontend/{topic}
        # desktop.js: listApps, the installed apps
        - GET /info/apps
        # desktop_events.js (backend, no zenoh-gateway): Desktop's event stream
        - GET /ui/events
    # zenoh.js (getZenoh, DimApp, desktop_events.js, gateway_base.js's watchConfig — so watchSharedConfig and
    # watchRecordingsDir): Subscription.update needs >=0.5.1
    "@zenoh-gateway": ">=0.5.1"
